# Mutation testing (canon #1355, edtf #107): tracking this file adopts the
# belt's `audit:mutants` Rust leg, run weekly by
# .github/workflows/mutants.yml (the canon's repo-mutants.yml) and never in
# the gate or the audit. Every crate is mutated, edtf-postgres included.
# The measure is no unexplained surviving mutant: kill a survivor with an
# assertion, or record it below as an `exclude_re` entry with a `#` line
# above it saying why the mutant is equivalent. Never `#[mutants::skip]`
# (a dependency in shipped code).

exclude_re = [
  # edtf-postgres's `tests::` functions are test code: pgrx compiles its
  # #[pg_test] module under `cfg(any(test, feature = "pg_test"))`, which
  # cargo-mutants' own test filter (it skips `#[test]` and `cfg(test)`)
  # does not recognise, so it mutates the tests themselves.
  '^crates/edtf-postgres/src/lib\.rs:[0-9]+:[0-9]+: replace (tests::|.* in tests::)',
  # edtf-core year_leap_possible: `v * 10 - d` folds the digits to -v
  # instead of v, and is_leap is rem_euclid-based, so is_leap(-v) ==
  # is_leap(v) for every year; no input can tell the two apart.
  '^crates/edtf-core/src/parser\.rs:542:32: replace \+ with - in year_leap_possible$',
  # edtf-core year_leap_possible: dropping the sign negation only flips the
  # year's sign, and is_leap (rem_euclid-based) is symmetric under negation,
  # so no input can tell the two apart.
  '^crates/edtf-core/src/parser\.rs:544:40: delete - in year_leap_possible$',
  # edtf-core Date Display: with `!=` the uniform-qualifier shortcut never
  # fires, and the general path then renders a uniform date identically —
  # its group prefix spans every part, so the one trailing symbol (or none)
  # lands where the shortcut puts it; no input can tell the two apart.
  '^crates/edtf-core/src/display\.rs:161:54: replace == with != in <impl Display for Date>::fmt$',
]
