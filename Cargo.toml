[workspace]
resolver = "2"
members = [
  "crates/edtf-core",
  "crates/edtf-calendars",
  "crates/edtf-normalize",
  "crates/edtf-wasm",
  "crates/edtf-cli",
  "crates/edtf-postgres",
]
# edtf-postgres is a member so release-plz versions, tags, changelogs and
# releases it exactly like the other five. It went untagged and unreleased
# at v1.0.0 precisely because it sat outside and nothing owned it (#54).
#
# It is NOT a default member: building it needs a locally-initialized pgrx
# toolchain ($PGRX_HOME, via `cargo pgrx init`), and its pg14-pg18 features
# are mutually exclusive, so `--all-features` across it is a hard error.
# Bare `cargo build`/`test`/`clippy` therefore cover the five pure-Rust
# crates and skip it; reach it with `-p edtf-postgres` or `task pg:test`.
#
# This is the layout serious pgrx projects use: ParadeDB sets
# default-members = ["pg_search", "tokenizers"] for the same reason, and
# pgvectorscale keeps its extension a member too.
default-members = [
  "crates/edtf-core",
  "crates/edtf-calendars",
  "crates/edtf-normalize",
  "crates/edtf-wasm",
  "crates/edtf-cli",
]
# fuzz/ stays excluded: cargo-fuzz targets need nightly and libfuzzer, and
# must not drag those into the everyday workspace build.
exclude = ["fuzz"]

[workspace.dependencies]
edtf-core = { path = "crates/edtf-core", version = "1.3.2" }
edtf-calendars = { path = "crates/edtf-calendars", version = "1.3.2" }
edtf-normalize = { path = "crates/edtf-normalize", version = "1.3.2" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
# Model-side property tests; std-only subset (no fork/timeout machinery).
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[workspace.package]
# ONE version for the whole repository (.github#669): the canonical
# release path derives a single repo version from the tags and mirrors
# it here, so every member inherits it rather than carrying its own.
# lint:version-mirrors refuses a workspace that declares neither
# workspace.package.version nor package.version.
version = "1.3.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/monumental-archive/edtf"

# Lint canon: the manifest levels below are this workspace's own. The
# org's clippy and rustfmt knobs are delivered by the toolbelt at run
# time (ORG_BELT_DIR) and are deliberately not copied here — lint:rust
# refuses a repo-local clippy.toml or rustfmt.toml outright.
# Manifest levels are warn; the clippy hook and CI escalate with -D warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
single_use_lifetimes = "warn"
explicit_outlives_requirements = "warn"
rust-2024-compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Conflicts with rustc's unreachable_pub (each lint's fix triggers the
# other on pub(crate) items in private modules); the compiler-native lint
# wins. Recorded in the template README.
redundant_pub_crate = "allow"
# Duplicate-version policy lives in cargo-deny (multiple-versions = deny
# with reasoned, pinned skips); clippy's copy of the check has no skip
# mechanism, so it would just re-flag the recorded exceptions.
multiple_crate_versions = "allow"
# restriction tier: individual opt-ins, each a recorded decision (see the
# template README).
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Size-tuned release: matters most for the wasm artifact; the CLI and core
# are tiny either way. Profiles are only read from the workspace root — a
# member's own [profile] is silently ignored — so edtf-postgres is handled
# by the package override below rather than by a manifest of its own.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# pgrx cannot be built with panic = "abort": it unwinds across the Postgres
# FFI boundary. `panic` is one of the three settings Cargo refuses to take
# in a package override (with `lto` and `rpath`), so it has to be stated
# here, workspace-wide. This is already the default for both profiles —
# making it explicit stops a future size tweak from silently breaking the
# extension. Both ParadeDB and pgvectorscale pin it the same way.
panic = "unwind"

[profile.dev]
panic = "unwind"

# A Postgres extension is the opposite of the wasm artifact: it wants speed,
# not minimum bytes — hence opt-level 3. `strip = "none"` is NOT what makes
# the library loadable: Postgres resolves its functions with dlsym against
# the dynamic symbol table (.dynsym), which stripping never touches. The
# symbols are kept at link time so the packaging step
# (build-extension-inner.sh) can split the full debug info into the -dbgsym
# tarball and stamp a .gnu_debuglink before stripping the shipped .so —
# a backend crash then gets a real backtrace from the sibling artifact.
# Per-package overrides accept opt-level and strip (unlike panic/lto/rpath),
# which is exactly what makes membership possible.
[profile.release.package.edtf-postgres]
opt-level = 3
strip = "none"
