[package]
name = "edtf-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# The number lint:msrv derives for this crate: its parent crate's.
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Explicitly its own workspace root. The main manifest's `exclude = ["fuzz"]`
# only shields the primary checkout; from a git worktree nested inside the
# repository directory, cargo's upward walk would otherwise escape to the
# primary checkout's manifest and claim this package.
[workspace]

# Lint canon: the org's clippy and rustfmt knobs are belt-delivered —
# mirrored from the main workspace (this manifest is its own workspace, so
# it cannot inherit). Keep the three blocks in lockstep.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
single_use_lifetimes = "warn"
explicit_outlives_requirements = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
libfuzzer-sys = "0.4"
edtf-core = { path = "../crates/edtf-core" }

# Only the normalize target uses the normaliser, and only under the
# `fuzzing` cfg cargo-fuzz builds with; an ordinary build leaves it out.
[target.'cfg(fuzzing)'.dependencies]
edtf-normalize = { path = "../crates/edtf-normalize" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relate"
path = "fuzz_targets/relate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false
