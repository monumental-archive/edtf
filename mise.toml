# Repo-specific tools and tasks only; the org belt arrives globally.
# ci is assembled by the toolbelt: define test/build/lint:* tasks here
# and they are collected automatically.
#
# No [settings] block beyond the lockfile: every knob this file used to
# carry — locked, minimum_release_age, disable_backends, pin,
# activate_aggressive, locked_verify_provenance — is org policy and is
# delivered by the belt. A second copy here could only drift or lower it.

[settings]
lockfile = true

[task_config]
# Tasks below are bash: the default task shell is sh, which is dash on
# Ubuntu runners. -euo pipefail is the point rather than a bare `bash -c`
# — without it a task whose failure signal is a tool's exit status passes
# if anything follows it, and the check goes green having not checked.
# Same setting the belt sets for its own tasks (#700).
shell = "bash -euo pipefail -c"

[env]
# Workspace members whose tests cannot run on the gate runner; consumed
# by coverage:check and coverage:report. edtf-postgres is a pgrx
# extension: its pg14..pg18 features are mutually exclusive and it needs
# an initialised $PGRX_HOME, so its tests run in the extension class's
# own containers, never under `cargo test` here.
COVERAGE_EXCLUDE = "edtf-postgres"
# Same member, same reason, for lint:rust — --all-features cannot
# compile a crate whose features contradict each other. Declared rather
# than inferred from default-members, so a reviewer sees it.
CLIPPY_EXCLUDE = "edtf-postgres"
# Which nightly audit:fuzz runs the sanitized targets under. Declared,
# never discovered: AddressSanitizer is cargo-fuzz's default and needs
# -Zsanitizer, which stable refuses. Must match the dated nightly in the
# rust pin below. This is the one pin in the org Renovate cannot bump.
FUZZ_TOOLCHAIN = "nightly-2026-07-20"
# How long each target fuzzes on the Monday cron. 300 rather than the
# 60s floor: on a weekly cron for a public repo the minutes are free.
FUZZ_SECONDS = "300"

[tools]
# Two toolchains, both locked by mise. The stable pin builds and
# releases everything; the dated nightly exists solely so audit:fuzz can
# run libFuzzer under AddressSanitizer on the cron. Components ride the
# pins so they install before any task runs — never a task-time rustup,
# which races every other task driving the toolchain. coverage:check
# asserts llvm-tools and lint:rust asserts clippy and rustfmt rather
# than installing them.
#
# No `targets =` here: the wasm-npm class runs `rustup target add
# wasm32-unknown-unknown` itself before wasm-pack.
rust = [
  { version = "1.97.1", components = "clippy,rustfmt,llvm-tools" },
  # rust-src is not optional on the nightly: audit:fuzz runs `--careful`,
  # which implies -Zbuild-std and rebuilds the standard library.
  { version = "nightly-2026-07-20", components = "rust-src" },
]
# Build input of the pgrx-extension class; must equal the pgrx crate
# dependency, which Cargo.lock resolves to 0.19.2.
"cargo:cargo-pgrx" = "0.19.2"
# Build input of the rust build classes: auditable binaries (.dep-v0).
"cargo:cargo-auditable" = "0.7.5"
# Build input of lint:fuzz-build and audit:fuzz; no upstream binaries and
# no aqua package, so the cargo backend builds it with the toolchain.
"cargo:cargo-fuzz" = "0.13.2"
# Build input of the wasm-npm class.
"aqua:rustwasm/wasm-pack" = "0.15.0"
node = "26.9.0"

[tasks.test]
description = "The workspace test suite, every feature, minus the extension"
# --all-features across edtf-postgres is a hard error (its pg majors are
# mutually exclusive) and it needs a live Postgres regardless, so it is
# excluded here exactly as it is from the coverage legs. The extension's
# own suite is `pg:test`, and the release proves it per major in the
# extension class's containers.
run = "cargo test --workspace --locked --all-features --exclude edtf-postgres"

[tasks.bench]
description = "The criterion benchmarks whose numbers the README publishes"
run = "cargo bench -p edtf-core --bench core"

[tasks.wasm]
description = "Build the WebAssembly artifact"
run = "cargo build -p edtf-wasm --target wasm32-unknown-unknown --release"

[tasks."wasm:pack"]
description = "Build the npm-ready package (JS glue + .d.ts) via wasm-pack"
run = "wasm-pack build crates/edtf-wasm --target web --out-dir pkg"

[tasks."pg:lint"]
description = "clippy over the Postgres extension (requires `cargo pgrx init`)"
# Not reachable from lint:rust: edtf-postgres is not a default member and
# linting it needs $PGRX_HOME plus exactly one pg feature.
# `--no-deps` is load-bearing: without it clippy also lints edtf-core under
# --no-default-features, where eight of its lint expectations do not fire and
# `-D warnings` turns every one into an error. Measured: this task has never
# passed without it.
run = "cargo clippy -p edtf-postgres --all-targets --no-default-features --features pg18 --no-deps -- -D warnings"

[tasks."pg:test"]
description = "The Postgres extension test suite (requires `cargo pgrx init`)"
dir = "crates/edtf-postgres"
run = "cargo pgrx test pg18"

[tasks."pg:package"]
description = "Package the Postgres extension for installation"
dir = "crates/edtf-postgres"
run = "cargo pgrx package"

[tasks."pg:schema-snapshot"]
description = "Diff the generated SQL surface against the snapshot (requires `cargo pgrx init`)"
env = { PG = "18" }
run = ".github/scripts/schema-snapshot.sh"
